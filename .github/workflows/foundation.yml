name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend lint and unit tests
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
          pytest -m "not integration"
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
      - name: Start real services
        run: docker compose up --build --wait --wait-timeout 180
      - name: Check API and database
        run: |
          curl --fail --silent --show-error http://localhost:8000/health/live
          curl --fail --silent --show-error http://localhost:8000/health/ready
          cd backend
          DATABASE_URL=postgresql://scientra:scientra_dev_only@localhost:5432/scientra pytest -m integration
      - name: Seed and verify real scientific records
        run: |
          docker compose exec -T backend python -m app.ingestion seed
          docker compose exec -T backend python -m app.ingestion summary
      - name: Browser smoke
        working-directory: frontend
        run: npm run test:e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down
